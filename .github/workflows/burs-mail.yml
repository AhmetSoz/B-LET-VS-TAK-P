name: Burs maili

on:
  schedule:
    - cron: "13 6 * * 1" # her pazartesi ~09:13 (Türkiye saati)
  workflow_dispatch:

jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Burs listesini e-postayla gönder
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.BURS_MAIL_TO }}
        run: |
          if [ -z "$GMAIL_USER" ] || [ -z "$GMAIL_APP_PASSWORD" ] || [ ! -f burs/burslar.json ]; then
            echo "Gmail bilgileri ya da burs listesi henüz hazır değil; atlanıyor."
            exit 0
          fi
          python burs/mail.py
