name: Bilet takip aktif 2
on:
  schedule:
    - cron: "*/5 * * * *" # 5 dk GitHub'ın izin verdiği en sık aralık (yoğunken gecikebilir)
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Sadece test bildirimi gönder"
        type: boolean
        default: false

permissions:
  contents: write # state.json'u güncellemek için
  issues: write # yeni oyun için issue açmak için

concurrency:
  group: bilet-takip
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Yaklaşan bir satış açılışı varsa iş kapanmadan bekler (en fazla 5,5 saat)
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          # Sırada bekleyen iş, tetiklendiği andaki eski commit'i değil dalın güncel halini açsın
          # (yoksa bot eski hafızayla çalışıp aynı bildirimleri tekrar gönderir)
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sayfayı kontrol et
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_TICKETS: ${{ vars.MIN_TICKETS || '2' }} # kaç kişilik bilet aranıyor
          # Burs botu her sabah 09:00'da bu işin içinden çalışır (burs/bot.py e-postası)
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.BURS_MAIL_TO }}
        run: |
          if [ "${{ inputs.test_notify }}" = "true" ]; then
            python monitor.py --test-notify
          else
            python monitor.py --watch
          fi

      - name: Durumu kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json izlenenler.txt burs/durum.json burs/burslar.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -q -m "Bilet durumu güncellendi"
            git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push -q  # çakışmada bu işin (daha yeni) durumu kazanır
          fi
