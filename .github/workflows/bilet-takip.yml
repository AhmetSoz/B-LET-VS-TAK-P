name: Bilet takip aktif 2
on:
  schedule:
    - cron: "*/5 * * * *" # 5 dk GitHub'ın izin verdiği en sık aralık (yoğunken gecikebilir)
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Sadece test bildirimi gönder"
        type: boolean
        default: false

permissions:
  contents: write # state.json'u güncellemek için
  issues: write # yeni oyun için issue açmak için

concurrency:
  group: bilet-takip
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Yaklaşan bir satış açılışı varsa iş kapanmadan bekler (en fazla 5,5 saat)
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sayfayı kontrol et
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_TICKETS: ${{ vars.MIN_TICKETS || '2' }} # kaç kişilik bilet aranıyor
        run: |
          if [ "${{ inputs.test_notify }}" = "true" ]; then
            python monitor.py --test-notify
          else
            python monitor.py --watch
          fi

      - name: Durumu kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json izlenenler.txt
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -q -m "Bilet durumu güncellendi"
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q
          fi
